<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EngiMind - Smart Engineering Deadline & Stress-Shield Planner</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            900: '#312e81',
                        }
                    }
                }
            }
        }
    </script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel Standalone for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        @keyframes pulse-slow {
            0%, 100% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.05); opacity: 1; }
        }
        .animate-pulse-slow { animation: pulse-slow 4s infinite ease-in-out; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen selection:bg-indigo-500 selection:text-white">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // Sample initial engineering tasks
        const INITIAL_TASKS = [
            {
                id: '1',
                title: 'VLSI Layout Design Lab',
                domain: 'Electronics & VLSI',
                branchImportance: 'Core (High Impact)',
                deadline: new Date(Date.now() + 86400000 * 2).toISOString().slice(0, 16),
                effort: 5,
                difficulty: 4,
                completed: false,
                subtasks: [
                    { id: 's1', text: 'Draw schematic in Cadence Virtuoso', done: true },
                    { id: 's2', text: 'Run DRC and LVS checks', done: false },
                    { id: 's3', text: 'Export GDSII layout report', done: false }
                ]
            },
            {
                id: '2',
                title: 'OS Multi-threading Simulator Project',
                domain: 'Computer Science',
                branchImportance: 'Core (High Impact)',
                deadline: new Date(Date.now() + 86400000 * 4).toISOString().slice(0, 16),
                effort: 8,
                difficulty: 5,
                completed: false,
                subtasks: [
                    { id: 's4', text: 'Implement mutex locks & semaphores', done: false },
                    { id: 's5', text: 'Simulate producer-consumer problem', done: false }
                ]
            },
            {
                id: '3',
                title: 'Thermodynamics Heat Exchanger Assignment',
                domain: 'Mechanical Engineering',
                branchImportance: 'Core (High Impact)',
                deadline: new Date(Date.now() + 86400000 * 1).toISOString().slice(0, 16),
                effort: 3,
                difficulty: 3,
                completed: false,
                subtasks: [
                    { id: 's6', text: 'Calculate LMTD values', done: false },
                    { id: 's7', text: 'Plot temperature distribution graphs', done: false }
                ]
            },
            {
                id: '4',
                title: 'Technical Communication Research Paper Review',
                domain: 'Humanities / General',
                branchImportance: 'Elective / Minor',
                deadline: new Date(Date.now() + 86400000 * 6).toISOString().slice(0, 16),
                effort: 2,
                difficulty: 2,
                completed: false,
                subtasks: [
                    { id: 's8', text: 'Read IEEE paper on renewable grids', done: false },
                    { id: 's9', text: 'Write 500-word critical summary', done: false }
                ]
            }
        ];

        function App() {
            const [tasks, setTasks] = useState(INITIAL_TASKS);
            const [activeTab, setActiveTab] = useState('dashboard');
            
            // Student Profile State
            const [profile, setProfile] = useState({
                name: 'Alex Chen',
                branch: 'Computer Science & Engineering',
                semester: '6th Semester',
                stressLevel: 6 // 1-10
            });

            // New Task Modal / Form State
            const [isAddModalOpen, setIsAddModalOpen] = useState(false);
            const [newTask, setNewTask] = useState({
                title: '',
                domain: 'Computer Science',
                branchImportance: 'Core (High Impact)',
                deadline: '',
                effort: 3,
                difficulty: 3
            });

            // Breathing Exercise State
            const [isBreathingActive, setIsBreathingActive] = useState(false);
            const [breathPhase, setBreathPhase] = useState('Inhale (4s)');
            const [breathCount, setBreathCount] = useState(4);

            // Pomodoro Timer State
            const [pomodoroActive, setPomodoroActive] = useState(false);
            const [pomodoroTime, setPomodoroTime] = useState(25 * 60);
            const [selectedTaskForTimer, setSelectedTaskForTimer] = useState(null);

            // Breathing Timer Effect
            useEffect(() => {
                let interval;
                if (isBreathingActive) {
                    interval = setInterval(() => {
                        setBreathCount((prev) => {
                            if (prev > 1) return prev - 1;
                            // Cycle phases
                            if (breathPhase.includes('Inhale')) {
                                setBreathPhase('Hold (4s)');
                                return 4;
                            } else if (breathPhase.includes('Hold') && breathPhase.includes('4s')) {
                                setBreathPhase('Exhale (4s)');
                                return 4;
                            } else if (breathPhase.includes('Exhale')) {
                                setBreathPhase('Rest (2s)');
                                return 2;
                            } else {
                                setBreathPhase('Inhale (4s)');
                                return 4;
                            }
                        });
                    }, 1000);
                }
                return () => clearInterval(interval);
            }, [isBreathingActive, breathPhase]);

            // Pomodoro Timer Effect
            useEffect(() => {
                let timer;
                if (pomodoroActive && pomodoroTime > 0) {
                    timer = setInterval(() => setPomodoroTime(t => t - 1), 1000);
                } else if (pomodoroTime === 0) {
                    setPomodoroActive(false);
                    alert("Pomodoro session completed! Take a 5-minute breather.");
                    setPomodoroTime(25 * 60);
                }
                return () => clearInterval(timer);
            }, [pomodoroActive, pomodoroTime]);

            // Calculate Smart Priority / Urgency Score for each task
            const evaluatedTasks = useMemo(() => {
                const now = new Date();
                return tasks.map(task => {
                    const deadlineDate = new Date(task.deadline);
                    const hoursLeft = Math.max(1, (deadlineDate - now) / (1000 * 60 * 60));
                    
                    // Importance weight
                    let importanceWeight = 1.0;
                    if (task.branchImportance.includes('Core')) importanceWeight = 2.0;
                    else if (task.branchImportance.includes('Project')) importanceWeight = 1.8;
                    else if (task.branchImportance.includes('Lab')) importanceWeight = 1.5;
                    else importanceWeight = 1.0;

                    // Formula: Urgency-Impact Score (UIS) = (Importance * Effort * Difficulty) / HoursLeft
                    // Higher score means higher priority
                    const rawScore = (importanceWeight * task.effort * task.difficulty * 24) / hoursLeft;
                    const uisScore = Math.round(rawScore * 10) / 10;

                    let priorityCategory = 'Standard';
                    let priorityColor = 'bg-blue-500/10 text-blue-400 border-blue-500/30';
                    if (uisScore > 25 || hoursLeft < 36) {
                        priorityCategory = '🔴 Critical Core';
                        priorityColor = 'bg-rose-500/10 text-rose-400 border-rose-500/30';
                    } else if (uisScore > 12) {
                        priorityCategory = '🟡 High Priority';
                        priorityColor = 'bg-amber-500/10 text-amber-400 border-amber-500/30';
                    } else if (task.effort <= 2) {
                        priorityCategory = '🟢 Quick Win';
                        priorityColor = 'bg-emerald-500/10 text-emerald-400 border-emerald-500/30';
                    }

                    return {
                        ...task,
                        hoursLeft: Math.round(hoursLeft),
                        uisScore,
                        priorityCategory,
                        priorityColor
                    };
                }).sort((a, b) => b.uisScore - a.uisScore);
            }, [tasks]);

            // Burnout analysis
            const totalEffortHours = tasks.filter(t => !t.completed).reduce((acc, t) => acc + t.effort, 0);
            const burnoutRisk = totalEffortHours > 25 ? 'High Burnout Risk' : totalEffortHours > 15 ? 'Moderate Load' : 'Balanced & Healthy';
            const burnoutColor = totalEffortHours > 25 ? 'text-rose-400 bg-rose-500/10 border-rose-500/30' : totalEffortHours > 15 ? 'text-amber-400 bg-amber-500/10 border-amber-500/30' : 'text-emerald-400 bg-emerald-500/10 border-emerald-500/30';

            const handleAddTask = (e) => {
                e.preventDefault();
                if (!newTask.title || !newTask.deadline) return;

                const created = {
                    id: Date.now().toString(),
                    ...newTask,
                    effort: Number(newTask.effort),
                    difficulty: Number(newTask.difficulty),
                    completed: false,
                    subtasks: [
                        { id: 'sub1', text: 'Initial research & requirements analysis', done: false },
                        { id: 'sub2', text: 'Core execution & drafting', done: false },
                        { id: 'sub3', text: 'Review, testing & final polish', done: false }
                    ]
                };

                setTasks([created, ...tasks]);
                setNewTask({
                    title: '',
                    domain: profile.branch,
                    branchImportance: 'Core (High Impact)',
                    deadline: '',
                    effort: 3,
                    difficulty: 3
                });
                setIsAddModalOpen(false);
            };

            const toggleTaskComplete = (id) => {
                setTasks(tasks.map(t => t.id === id ? { ...t, completed: !t.completed } : t));
            };

            const toggleSubtask = (taskId, subId) => {
                setTasks(tasks.map(t => {
                    if (t.id === taskId) {
                        const updatedSubtasks = t.subtasks.map(s => s.id === subId ? { ...s, done: !s.done } : s);
                        return { ...t, subtasks: updatedSubtasks };
                    }
                    return t;
                }));
            };

            const deleteTask = (id) => {
                setTasks(tasks.filter(t => t.id !== id));
            };

            return (
                <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col font-sans">
                    {/* Top Navigation Header */}
                    <header className="border-b border-slate-800 bg-slate-900/60 backdrop-blur-md sticky top-0 z-40 px-6 py-4 flex items-center justify-between">
                        <div className="flex items-center space-x-3">
                            <div className="h-10 w-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center shadow-lg shadow-indigo-500/30">
                                <svg className="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012-2m-6 9l2 2 4-4" />
                                </svg>
                            </div>
                            <div>
                                <h1 className="text-xl font-bold tracking-tight text-white flex items-center gap-2">
                                    EngiMind <span className="text-xs px-2 py-0.5 rounded-full bg-indigo-500/20 text-indigo-400 border border-indigo-500/30">Hackathon Prototype</span>
                                </h1>
                                <p className="text-xs text-slate-400">Smart Engineering Deadline & Stress-Shield Planner</p>
                            </div>
                        </div>

                        {/* Profile & Stress Indicator Pill */}
                        <div className="flex items-center space-x-4">
                            <div className={`hidden sm:flex items-center gap-2 px-3 py-1.5 rounded-full border text-xs font-medium ${burnoutColor}`}>
                                <span className="w-2 h-2 rounded-full animate-ping bg-current"></span>
                                {burnoutRisk} ({totalEffortHours}h workload)
                            </div>

                            <div className="flex items-center gap-3 bg-slate-900 border border-slate-800 px-3 py-1.5 rounded-xl">
                                <div className="text-right">
                                    <div className="text-xs font-semibold text-white">{profile.name}</div>
                                    <div className="text-[10px] text-slate-400">{profile.branch}</div>
                                </div>
                                <div className="h-8 w-8 rounded-lg bg-indigo-600/30 border border-indigo-500/40 flex items-center justify-center font-bold text-indigo-300">
                                    {profile.name.charAt(0)}
                                </div>
                            </div>
                        </div>
                    </header>

                    {/* Navigation Tabs */}
                    <div className="bg-slate-900/40 border-b border-slate-800 px-6 flex space-x-2 overflow-x-auto">
                        <button 
                            onClick={() => setActiveTab('dashboard')} 
                            className={`px-4 py-3 text-sm font-medium border-b-2 transition-all flex items-center gap-2 ${activeTab === 'dashboard' ? 'border-indigo-500 text-indigo-400 bg-indigo-500/5' : 'border-transparent text-slate-400 hover:text-slate-200'}`}
                        >
                            <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
                            Dashboard & Smart Queue
                        </button>
                        <button 
                            onClick={() => setActiveTab('stressShield')} 
                            className={`px-4 py-3 text-sm font-medium border-b-2 transition-all flex items-center gap-2 ${activeTab === 'stressShield' ? 'border-indigo-500 text-indigo-400 bg-indigo-500/5' : 'border-transparent text-slate-400 hover:text-slate-200'}`}
                        >
                            <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                            Stress-Shield & Focus Hub
                        </button>
                        <button 
                            onClick={() => setActiveTab('analytics')} 
                            className={`px-4 py-3 text-sm font-medium border-b-2 transition-all flex items-center gap-2 ${activeTab === 'analytics' ? 'border-indigo-500 text-indigo-400 bg-indigo-500/5' : 'border-transparent text-slate-400 hover:text-slate-200'}`}
                        >
                            <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
                            Branch Workload & Insights
                        </button>
                    </div>

                    {/* Main Content Area */}
                    <main className="flex-1 p-6 max-w-7xl mx-auto w-full">
                        {activeTab === 'dashboard' && (
                            <div className="space-y-6">
                                {/* Banner / Quick Stats */}
                                <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                                    <div className="bg-slate-900 border border-slate-800 p-5 rounded-2xl relative overflow-hidden">
                                        <div className="text-slate-400 text-xs font-medium uppercase tracking-wider">Active Tasks</div>
                                        <div className="text-3xl font-bold text-white mt-1">{evaluatedTasks.filter(t => !t.completed).length}</div>
                                        <div className="text-xs text-indigo-400 mt-2 flex items-center gap-1">
                                            <span>{evaluatedTasks.filter(t => t.completed).length} completed this week</span>
                                        </div>
                                    </div>
                                    <div className="bg-slate-900 border border-slate-800 p-5 rounded-2xl relative overflow-hidden">
                                        <div className="text-slate-400 text-xs font-medium uppercase tracking-wider">Total Effort Required</div>
                                        <div className="text-3xl font-bold text-white mt-1">{totalEffortHours} <span className="text-sm font-normal text-slate-400">hours</span></div>
                                        <div className="text-xs text-slate-400 mt-2">Across all engineering domains</div>
                                    </div>
                                    <div className="bg-slate-900 border border-slate-800 p-5 rounded-2xl relative overflow-hidden">
                                        <div className="text-slate-400 text-xs font-medium uppercase tracking-wider">Burnout Risk Index</div>
                                        <div className={`text-lg font-bold mt-1 ${totalEffortHours > 25 ? 'text-rose-400' : 'text-emerald-400'}`}>{burnoutRisk}</div>
                                        <div className="text-xs text-slate-400 mt-2">Based on current workload & deadlines</div>
                                    </div>
                                    <div className="bg-gradient-to-br from-indigo-900/40 to-violet-900/40 border border-indigo-500/30 p-5 rounded-2xl flex flex-col justify-between">
                                        <div>
                                            <div className="text-indigo-300 text-xs font-medium uppercase tracking-wider">Quick Action</div>
                                            <div className="text-sm font-semibold text-white mt-1">Need to add a new assignment?</div>
                                        </div>
                                        <button 
                                            onClick={() => setIsAddModalOpen(true)}
                                            className="mt-3 w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2 px-4 rounded-xl text-xs transition shadow-lg shadow-indigo-600/30 flex items-center justify-center gap-2"
                                        >
                                            <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4"/></svg>
                                            Add New Deadline
                                        </button>
                                    </div>
                                </div>

                                {/* Smart Prioritized Task Queue */}
                                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6">
                                    <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between pb-6 border-b border-slate-800 gap-4">
                                        <div>
                                            <h2 className="text-lg font-bold text-white flex items-center gap-2">
                                                🧠 AI Priority-Sorted Engineering Queue
                                                <span className="text-xs px-2.5 py-0.5 rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 font-normal">Auto-Ranked by UIS</span>
                                            </h2>
                                            <p className="text-xs text-slate-400 mt-1">Tasks are weighted by branch importance, difficulty, effort needed, and time remaining.</p>
                                        </div>
                                        <button 
                                            onClick={() => setIsAddModalOpen(true)}
                                            className="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-xl text-sm font-medium transition flex items-center gap-2 shadow-lg shadow-indigo-600/20"
                                        >
                                            + Add Deadline
                                        </button>
                                    </div>

                                    {/* Task List */}
                                    <div className="mt-6 space-y-4">
                                        {evaluatedTasks.length === 0 ? (
                                            <div className="text-center py-12 text-slate-500">
                                                <p>No deadlines found. Add your assignments to get started!</p>
                                            </div>
                                        ) : (
                                            evaluatedTasks.map((task) => (
                                                <div 
                                                    key={task.id} 
                                                    className={`p-5 rounded-2xl border transition-all ${task.completed ? 'bg-slate-900/40 border-slate-800 opacity-60' : 'bg-slate-900/80 border-slate-800 hover:border-slate-700 shadow-xl'}`}
                                                >
                                                    <div className="flex flex-col md:flex-row md:items-center justify-between gap-4">
                                                        <div className="flex items-start space-x-4">
                                                            <input 
                                                                type="checkbox" 
                                                                checked={task.completed} 
                                                                onChange={() => toggleTaskComplete(task.id)}
                                                                className="mt-1.5 h-5 w-5 rounded border-slate-700 bg-slate-800 text-indigo-600 focus:ring-indigo-500 cursor-pointer"
                                                            />
                                                            <div>
                                                                <div className="flex items-center gap-2 flex-wrap">
                                                                    <h3 className={`font-semibold text-white text-base ${task.completed ? 'line-through text-slate-400' : ''}`}>
                                                                        {task.title}
                                                                    </h3>
                                                                    <span className={`text-[10px] px-2.5 py-0.5 rounded-full border font-semibold ${task.priorityColor}`}>
                                                                        {task.priorityCategory}
                                                                    </span>
                                                                    <span className="text-[10px] px-2.5 py-0.5 rounded-full bg-slate-800 text-slate-300 border border-slate-700">
                                                                        {task.branchImportance}
                                                                    </span>
                                                                </div>
                                                                <div className="text-xs text-slate-400 mt-1 flex items-center gap-4 flex-wrap">
                                                                    <span>Domain: <strong className="text-slate-200">{task.domain}</strong></span>
                                                                    <span>⏱️ Effort: <strong className="text-slate-200">{task.effort} hrs</strong></span>
                                                                    <span>⏳ Due in: <strong className={task.hoursLeft < 36 ? 'text-rose-400 font-bold' : 'text-slate-200'}>{task.hoursLeft} hours</strong></span>
                                                                    <span>📊 UIS Score: <strong className="text-indigo-400">{task.uisScore}</strong></span>
                                                                </div>
                                                            </div>
                                                        </div>

                                                        {/* Actions & Focus */}
                                                        <div className="flex items-center gap-2 self-end md:self-center">
                                                            <button 
                                                                onClick={() => {
                                                                    setSelectedTaskForTimer(task);
                                                                    setActiveTab('stressShield');
                                                                }}
                                                                className="px-3 py-1.5 rounded-xl bg-indigo-600/20 hover:bg-indigo-600/30 text-indigo-300 border border-indigo-500/30 text-xs font-medium transition flex items-center gap-1.5"
                                                                title="Start Focus Session"
                                                            >
                                                                <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                                                                Focus
                                                            </button>
                                                            <button 
                                                                onClick={() => deleteTask(task.id)}
                                                                className="p-1.5 rounded-xl bg-slate-800 hover:bg-rose-500/20 text-slate-400 hover:text-rose-400 transition"
                                                                title="Delete Task"
                                                            >
                                                                <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                                                            </button>
                                                        </div>
                                                    </div>

                                                    {/* Subtasks / AI Micro-steps */}
                                                    <div className="mt-4 pt-3 border-t border-slate-800/80">
                                                        <div className="text-[11px] font-semibold text-slate-400 uppercase tracking-wider mb-2">AI Breakdown & Subtasks:</div>
                                                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2">
                                                            {task.subtasks.map((sub) => (
                                                                <div 
                                                                    key={sub.id} 
                                                                    onClick={() => toggleSubtask(task.id, sub.id)}
                                                                    className={`flex items-center gap-2 p-2 rounded-lg border text-xs cursor-pointer transition ${sub.done ? 'bg-emerald-500/10 border-emerald-500/30 text-emerald-300 line-through' : 'bg-slate-800/40 border-slate-800 text-slate-300 hover:border-slate-700'}`}
                                                                >
                                                                    <input type="checkbox" checked={sub.done} onChange={() => {}} className="rounded bg-slate-900 border-slate-700 text-emerald-500 h-3.5 w-3.5"/>
                                                                    <span className="truncate">{sub.text}</span>
                                                                </div>
                                                            ))}
                                                        </div>
                                                    </div>
                                                </div>
                                            ))
                                        )}
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'stressShield' && (
                            <div className="space-y-6">
                                <div className="bg-gradient-to-r from-indigo-900/40 via-purple-900/40 to-slate-900 border border-indigo-500/30 rounded-3xl p-8 relative overflow-hidden">
                                    <div className="max-w-xl">
                                        <span className="px-3 py-1 rounded-full bg-indigo-500/20 text-indigo-300 text-xs font-semibold border border-indigo-500/30">Stress-Shield & Anti-Panic Zone</span>
                                        <h2 className="text-2xl font-bold text-white mt-3">Calm your mind. Execute with laser focus.</h2>
                                        <p className="text-sm text-slate-300 mt-2">Engineering students face severe cognitive load and deadline anxiety. Use our built-in breathing anchor and Pomodoro focus shield to eliminate overthinking.</p>
                                    </div>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    {/* Box Breathing Anchor */}
                                    <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 flex flex-col items-center text-center justify-between">
                                        <div>
                                            <h3 className="text-lg font-bold text-white">🫁 4-7-4 Box Breathing Anchor</h3>
                                            <p className="text-xs text-slate-400 mt-1">Scientifically proven to lower cortisol and reset cognitive focus in 60 seconds.</p>
                                        </div>

                                        <div className="my-8 relative">
                                            <div className={`w-36 h-36 rounded-full bg-indigo-600/20 border-2 border-indigo-500 flex items-center justify-center transition-all duration-1000 ${isBreathingActive ? 'scale-110 shadow-2xl shadow-indigo-500/50' : 'scale-100'}`}>
                                                <div className="text-center">
                                                    <div className="text-xl font-bold text-white">{isBreathingActive ? breathPhase : 'Ready'}</div>
                                                    <div className="text-xs text-indigo-300 mt-1">{isBreathingActive ? `${breathCount}s` : 'Click Start'}</div>
                                                </div>
                                            </div>
                                        </div>

                                        <button 
                                            onClick={() => setIsBreathingActive(!isBreathingActive)}
                                            className={`w-full py-3 rounded-xl font-medium text-sm transition shadow-lg ${isBreathingActive ? 'bg-rose-600 hover:bg-rose-500 text-white' : 'bg-indigo-600 hover:bg-indigo-500 text-white'}`}
                                        >
                                            {isBreathingActive ? 'Stop Breathing Exercise' : 'Start 1-Min Breathing Exercise'}
                                        </button>
                                    </div>

                                    {/* Focus Pomodoro Timer */}
                                    <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 flex flex-col justify-between">
                                        <div>
                                            <h3 className="text-lg font-bold text-white">⏱️ Deep Work Pomodoro Shield</h3>
                                            <p className="text-xs text-slate-400 mt-1">
                                                {selectedTaskForTimer ? `Focusing on: ${selectedTaskForTimer.title}` : 'Select a task from Dashboard or start general session.'}
                                            </p>
                                        </div>

                                        <div className="my-8 text-center">
                                            <div className="text-5xl font-extrabold text-white tracking-widest font-mono">
                                                {Math.floor(pomodoroTime / 60).toString().padStart(2, '0')}:{(pomodoroTime % 60).toString().padStart(2, '0')}
                                            </div>
                                            <div className="text-xs text-slate-400 mt-2">25 Minutes of Uninterrupted Engineering Flow</div>
                                        </div>

                                        <div className="flex gap-3">
                                            <button 
                                                onClick={() => setPomodoroActive(!pomodoroActive)}
                                                className={`flex-1 py-3 rounded-xl font-medium text-sm transition ${pomodoroActive ? 'bg-amber-600 hover:bg-amber-500 text-white' : 'bg-emerald-600 hover:bg-emerald-500 text-white'}`}
                                            >
                                                {pomodoroActive ? 'Pause Timer' : 'Start Focus Session'}
                                            </button>
                                            <button 
                                                onClick={() => { setPomodoroActive(false); setPomodoroTime(25 * 60); }}
                                                className="px-4 py-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-sm font-medium transition"
                                            >
                                                Reset
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'analytics' && (
                            <div className="space-y-6">
                                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6">
                                    <h2 className="text-lg font-bold text-white">📊 Branch Workload & Strategic Alignment</h2>
                                    <p className="text-xs text-slate-400 mt-1">Analyzing your branch relevance vs elective distribution to protect your GPA.</p>
                                    
                                    <div className="mt-6 grid grid-cols-1 md:grid-cols-3 gap-4">
                                        <div className="bg-slate-950 p-4 rounded-xl border border-slate-800">
                                            <div className="text-xs text-slate-400">Core Subjects Load</div>
                                            <div className="text-2xl font-bold text-indigo-400 mt-1">
                                                {tasks.filter(t => t.branchImportance.includes('Core')).reduce((acc, t) => acc + t.effort, 0)} hrs
                                            </div>
                                            <div className="text-[11px] text-slate-500 mt-1">Highest career weight</div>
                                        </div>
                                        <div className="bg-slate-950 p-4 rounded-xl border border-slate-800">
                                            <div className="text-xs text-slate-400">Lab & Practicals Load</div>
                                            <div className="text-2xl font-bold text-amber-400 mt-1">
                                                {tasks.filter(t => t.branchImportance.includes('Lab')).reduce((acc, t) => acc + t.effort, 0)} hrs
                                            </div>
                                            <div className="text-[11px] text-slate-500 mt-1">Requires hands-on simulation</div>
                                        </div>
                                        <div className="bg-slate-950 p-4 rounded-xl border border-slate-800">
                                            <div className="text-xs text-slate-400">Electives & Minor Load</div>
                                            <div className="text-2xl font-bold text-emerald-400 mt-1">
                                                {tasks.filter(t => t.branchImportance.includes('Elective')).reduce((acc, t) => acc + t.effort, 0)} hrs
                                            </div>
                                            <div className="text-[11px] text-slate-500 mt-1">Standard course credits</div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* Add Task Modal */}
                    {isAddModalOpen && (
                        <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-slate-900 border border-slate-800 rounded-3xl max-w-lg w-full p-6 shadow-2xl">
                                <div className="flex items-center justify-between pb-4 border-b border-slate-800">
                                    <h3 className="text-lg font-bold text-white">Add New Engineering Deadline</h3>
                                    <button onClick={() => setIsAddModalOpen(false)} className="text-slate-400 hover:text-white">✕</button>
                                </div>

                                <form onSubmit={handleAddTask} className="mt-4 space-y-4">
                                    <div>
                                        <label className="block text-xs font-medium text-slate-400 mb-1">Task / Assignment Title</label>
                                        <input 
                                            type="text" 
                                            required
                                            value={newTask.title} 
                                            onChange={e => setNewTask({...newTask, title: e.target.value})}
                                            placeholder="e.g. Digital Signal Processing Filter Design" 
                                            className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500"
                                        />
                                    </div>

                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-xs font-medium text-slate-400 mb-1">Engineering Domain</label>
                                            <select 
                                                value={newTask.domain}
                                                onChange={e => setNewTask({...newTask, domain: e.target.value})}
                                                className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500"
                                            >
                                                <option>Computer Science</option>
                                                <option>Electronics & VLSI</option>
                                                <option>Mechanical Engineering</option>
                                                <option>Electrical Power</option>
                                                <option>Civil & Structures</option>
                                                <option>AI & Data Science</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-xs font-medium text-slate-400 mb-1">Branch Importance</label>
                                            <select 
                                                value={newTask.branchImportance}
                                                onChange={e => setNewTask({...newTask, branchImportance: e.target.value})}
                                                className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500"
                                            >
                                                <option>Core (High Impact)</option>
                                                <option>Lab / Practical</option>
                                                <option>Major Project</option>
                                                <option>Elective / Minor</option>
                                            </select>
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-xs font-medium text-slate-400 mb-1">Deadline Date & Time</label>
                                            <input 
                                                type="datetime-local" 
                                                required
                                                value={newTask.deadline}
                                                onChange={e => setNewTask({...newTask, deadline: e.target.value})}
                                                className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-medium text-slate-400 mb-1">Estimated Effort (Hours)</label>
                                            <input 
                                                type="number" 
                                                min="1" 
                                                max="50"
                                                value={newTask.effort}
                                                onChange={e => setNewTask({...newTask, effort: e.target.value})}
                                                className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500"
                                            />
                                        </div>
                                    </div>

                                    <div className="flex justify-end gap-3 pt-4 border-t border-slate-800">
                                        <button 
                                            type="button" 
                                            onClick={() => setIsAddModalOpen(false)}
                                            className="px-4 py-2 rounded-xl bg-slate-800 text-slate-300 text-sm font-medium hover:bg-slate-700 transition"
                                        >
                                            Cancel
                                        </button>
                                        <button 
                                            type="submit" 
                                            className="px-5 py-2 rounded-xl bg-indigo-600 text-white text-sm font-medium hover:bg-indigo-500 transition shadow-lg shadow-indigo-600/30"
                                        >
                                            Save & Prioritize
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
